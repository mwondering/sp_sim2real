task_name: "dual-teacher"
target: "real"

tracking_config: "tracking.yaml"

dual_onnx: "ckpts/DualTeacher/model_30000.onnx"
input_mode: "motion"  # motion or velocity
reference_fps: 50.0
input_timeout_s: 0.25

# Keep the existing tracking policy active as a balancing fallback. Switch to
# dual only after its inputs remain ready, and blend both transition directions.
handoff:
  blend_duration_s: 1.0
  ready_hold_s: 0.1

velocity_command:
  deadband: 0.1
  max_vx: 1.0
  max_vy: 1.0
  max_wz: 0.5
  terrain_class: 2

# Used only when input_mode is velocity. The camera host publishes raw D435i
# Z16 frames; preprocessing remains on the policy host.
camera_process:
  source: "d435i"
  depth_connect: "tcp://127.0.0.1:28811"
  timeout_s: 0.25
  max_invalid_fraction: 0.6
  hardware:
    width: 640
    height: 360
  preprocess:
    min_distance_m: 0.05
    normalization_max_distance_m: 2.0
    invalid_value: -1.0
    valid_threshold: 0.5
    crop_top: 10
    crop_bottom: 0
    crop_left: 10
    crop_right: 10
    edge_fill_left_columns: 24
