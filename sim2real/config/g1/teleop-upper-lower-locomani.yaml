task_name: "teleop-upper-lower-locomani"
target: "sim"

# Exact ONNX branch exports of mjlab-loco/logs/model_40500.pt.
lower_onnx: "ckpts/MJLab_Locomani/lower.onnx"
upper_onnx: "ckpts/MJLab_Locomani/upper.onnx"

scene_xml: "assets/g1_teleop_upper_lower_locomani.xml"
kinematics_xml: "assets/g1_teleop_upper_lower_locomani.xml"

switch:
  button: "right_key_two"
  blend_duration_s: 0.4
  neutral_hold_s: 0.25
  stick_deadband: 0.1

camera_process:
  source: "mujoco"
  site_name: "depth_camera"
  sim_state_connect: "tcp://127.0.0.1:28810"
  depth_bind: "tcp://*:28811"
  depth_connect: "tcp://127.0.0.1:28811"
  update_hz: 30.0
  timeout_s: 0.25
  max_invalid_fraction: 0.6
  seed: 0

safety:
  state_timeout_is_fatal: false
  safe_hold_kp_scale: 0.5
  safe_hold_min_kd: 2.0
  max_abs_gyro_rad_s: 4.0
  max_tilt_rad: 0.7
