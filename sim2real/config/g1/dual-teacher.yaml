task_name: "dual-teacher"
target: "sim"

# Existing tracking policy owns the PICO transport, retarget and buffered
# reference chain, and remains the balancing fallback around dual handoffs.
tracking_config: "tracking.yaml"

dual_onnx: "ckpts/DualTeacher/model_30000.onnx"
input_mode: "motion"  # motion or velocity
reference_fps: 50.0
input_timeout_s: 0.25

# Keep the existing tracking policy active as a balancing fallback. Switch to
# dual only after its inputs remain ready, and blend both transition directions.
handoff:
  blend_duration_s: 1.0
  ready_hold_s: 0.1

velocity_command:
  deadband: 0.1
  max_vx: 1.0
  max_vy: 1.0
  max_wz: 0.5
  terrain_class: 2

# Used only when input_mode is velocity. The independent MuJoCo depth process
# publishes an already preprocessed float32[1,36,64] frame on this endpoint.
camera_process:
  source: "mujoco"
  depth_connect: "tcp://127.0.0.1:28811"
  timeout_s: 0.25
  max_invalid_fraction: 0.6
